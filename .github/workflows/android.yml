# Builds the Android/Google TV app and attaches the APK to a GitHub release.
#
# Nothing to install locally: push a tag that starts with android-v and this
# does the rest. Or run it by hand from the Actions tab and download the APK
# from the run's artifacts.
#
#   git tag android-v1.0 && git push origin android-v1.0
name: Android app

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No SDK install step: GitHub's Ubuntu runner ships with the Android
      # SDK at $ANDROID_HOME, licences accepted, and Gradle fetches the
      # platform and build tools it needs from there.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the APK after the tag
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/release/app-release.apk "LongJohn-${VERSION}.apk"
          echo "APK=LongJohn-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LongJohn-apk
          path: ${{ env.APK }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          body: |
            LongJohn for Google TV and Android. Sideload the APK; see android/README.md.
