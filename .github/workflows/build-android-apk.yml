# Builds the Android/Google TV app and attaches the APK to the release for a
# version tag. The tag comes from `npm run release` at the repo root, which
# bumps package.json, rebuilds the frontend as a check, commits, tags v1.3.1
# and pushes. Nothing here runs on an ordinary push to master.
#
# The Actions tab also has a "Run workflow" button for a one-off build; that
# one only leaves the APK as a run artifact.
#
# A `kids-<N>` tag builds the same app under a different package name for a
# Google TV Kids profile. A Kids profile keeps only apps whose package name is
# on its Play-approved list and uninstalls everything else, so LongJohn gets
# in by carrying the name of a free, already-approved Play app (that app is
# uninstalled from the TV first). The name is KIDS_APP_ID below.
name: Build Android APK

on:
  push:
    tags: ['v*', 'kids-*']
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Package name to build under (blank = com.longjohn.tv)'
        required: false
        default: ''

env:
  KIDS_APP_ID: miada.tv.webbrowser

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No SDK install step: GitHub's Ubuntu runner ships with the Android
      # SDK at $ANDROID_HOME, licences accepted, and Gradle fetches the
      # platform and build tools it needs from there.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The web app rides inside the APK: built here and copied to assets/www,
      # so a new release carries the pages as well as the wrapper.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the web app into the APK
        run: |
          npm ci --prefix app
          npm --prefix app run build
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r app/public android/app/src/main/assets/www
          ls android/app/src/main/assets/www

      # Which package name this build gets: the kids one for a kids-* tag,
      # whatever the "Run workflow" button was given, else the real one.
      - name: Pick the package name
        run: |
          APP_ID="${{ github.event.inputs.app_id }}"
          case "${{ github.ref_name }}" in kids-*) APP_ID="$KIDS_APP_ID";; esac
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "Building as package: ${APP_ID:-com.longjohn.tv}"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon ${APP_ID:+-PappId=$APP_ID}

      # The version in the file name is package.json's, the same one Gradle
      # stamped into the app, so the tag, the file and Settings all agree.
      # A build under another package name says so: LongJohn-8-kids.apk.
      - name: Name the APK after the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SUFFIX=""; [ -n "$APP_ID" ] && SUFFIX="-kids"
          cp android/app/build/outputs/apk/release/app-release.apk "LongJohn-${VERSION}${SUFFIX}.apk"
          echo "APK=LongJohn-${VERSION}${SUFFIX}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LongJohn-apk
          path: ${{ env.APK }}

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          body: |
            LongJohn ${{ github.ref_name }}. Sideload the APK on a Google TV; see android/README.md.
            ${{ env.APP_ID && format('Built under package name {0} for a Google TV Kids profile.', env.APP_ID) || '' }}
